version: "3.9"
services:
  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: anchor
      POSTGRES_PASSWORD: anchor_dev_pw
      POSTGRES_DB: anchor_db
    ports:
      - "5432:5432"
    volumes:
      - anchor_pgdata:/var/lib/postgresql/data
volumes:
  anchor_pgdata: